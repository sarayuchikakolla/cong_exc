<!DOCTYPE html>
<html>
<body>
    <select id="eventType" onchange="saveData()">
        <option>Music</option>
        <option>Sports</option>
        <option>Food</option>   
        <option>Art</option>
    </select>
    <br><br>
    <button onclick="clearData()">
        Clear Preference
    </button>
    <script>
        function saveData() {
            let value =
                document.getElementById("eventType").value;
            localStorage.setItem("event", value);
            sessionStorage.setItem("event", value);
        }
        window.onload = function() {
            let saved =
                localStorage.getItem("event");
            if(saved) {
                document.getElementById("eventType").value =
                    saved;
            }
        }
        function clearData() {
            localStorage.clear();
            sessionStorage.clear();
            document.getElementById("eventType").selectedIndex = 0;
        }   
    </script>

</body>
</html>
