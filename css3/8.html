<!DOCTYPE html>
<html>
<head>

    <title>Table Styling</title>

    <style>

        table{
            width: 100%;
            border-collapse: collapse;
        }

        th,td{
            border: 1px solid black;
            padding: 10px;
            text-align: center;
        }

        tr:nth-child(even){
            background-color: lightgray;
        }

    </style>

</head>
<body>

    <table>

        <tr>
            <th>Name</th>
            <th>Date</th>
        </tr>

        <tr>
            <td>Music Fest</td>
            <td>June 10</td>
        </tr>

        <tr>
            <td>Food Fest</td>
            <td>June 15</td>
        </tr>

    </table>

</body>
</html>
