<!DOCTYPE html>
<html>
<head>

    <title>Links</title>

    <style>

        ul{
            list-style-type: none;
        }

        li{
            padding: 10px;
            margin: 10px;
        }

        a:link{
            color: blue;
        }

        a:hover{
            color: red;
        }

        a:active{
            color: green;
        }

        a:visited{
            color: purple;
        }

    </style>

</head>
<body>

    <ul>

        <li><a href="#">Home</a></li>

        <li><a href="#">Events</a></li>

        <li><a href="#">Contact</a></li>

    </ul>

</body>
</html>
