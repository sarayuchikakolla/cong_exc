<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Dashboard Colors</title>

    <link href="css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container mt-5">

    <div class="row g-3">

        <div class="col-md-3">
            <div class="bg-primary text-white p-4 rounded">
                Primary Box
            </div>
        </div>

        <div class="col-md-3">
            <div class="bg-warning text-dark p-4 rounded">
                Warning Box
            </div>
        </div>

        <div class="col-md-3">
            <div class="bg-success text-white p-4 rounded">
                Success Box
            </div>
        </div>

        <div class="col-md-3">
            <div class="bg-danger text-white p-4 rounded">
                Danger Box
            </div>
        </div>

    </div>

</div>

</body>
</html>
