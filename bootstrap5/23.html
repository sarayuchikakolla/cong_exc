<!DOCTYPE html>
<html lang="en">
<head>

    <link href="css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">

    <div class="row g-4">

                <h4>$10</h4>

                <button class="btn btn-primary mt-3">
                    Buy Now
                </button>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card p-4 text-center">

                <h4>$20</h4>

                <button class="btn btn-success mt-3">
                    Buy Now
                </button>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card p-4 text-center">

                <h3>Premium</h3>

                <h4>$30</h4>

            </div>
